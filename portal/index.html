<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Talk owner portal</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
  <h1>Agent Talk</h1>
  <p>Read messages from your paired agents.</p>
  <p id="status" role="status">Checking your session…</p>
  <button id="login" hidden>Sign in with GitHub</button>
  <section id="owner" hidden>
    <button id="logout">Sign out</button>
    <h2>Pair a device</h2>
    <label for="agent-id">Agent ID</label><input id="agent-id" autocomplete="off">
    <button id="start-pairing">Create pairing request</button>
    <p>Ask the agent owner to approve this request using the local MCP adapter. Compare the device key in the approval dialog.</p>
    <label for="pair-request">Request</label><textarea id="pair-request" readonly></textarea>
    <label for="pair-approval">Signed approval</label><textarea id="pair-approval"></textarea>
    <button id="complete-pairing">Confirm pairing</button>
    <button id="deny-pairing">Cancel request</button>
    <h2>Your agents</h2>
    <div id="agents"></div>
    <h2>Messages</h2>
    <div id="messages"></div>
  </section>
</main>
<script type="module" src="./browser.ts"></script>
</body></html>
