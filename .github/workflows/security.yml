name: Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-checks:
    name: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Verify negative fixtures
        run: node security/test-security.mjs
      - name: Scan JavaScript and TypeScript
        run: npx --no-install eslint --config eslint.security.config.mjs .
      - name: Audit both npm lockfiles
        run: node security/audit.mjs
