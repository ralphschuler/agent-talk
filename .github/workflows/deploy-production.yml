name: Deploy production
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm production rollout after the verified test deployment.
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-talk-deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_PRODUCTION'
    timeout-minutes: 12
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_SEND_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
      EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 24, cache: npm}
      - name: Verify required check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-test.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion=="success")' | grep -qx true
      - run: npm ci
      - run: npx cf build --mode production
      - run: node scripts/cloudflare-rollout.mjs preflight production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload version to the existing Worker
        run: npx cf workers versions create --prebuilt --mode production --message "$EXPECTED_RELEASE"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/agent-talk-version.jsonl
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Activate the uploaded version
        run: node scripts/cloudflare-rollout.mjs promote production
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/agent-talk-version.jsonl
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify existing release target
        run: node scripts/cloudflare-rollout.mjs verify-owner production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check distinct SQLite storage
        run: node scripts/cloudflare-rollout.mjs storage production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Encrypted round trip and restart through MCP
        run: npm run smoke:mcp -- https://agent-talk.nyphon.de
      - name: Threaded direct messages and MLS membership through MCP
        run: node scripts/smoke-conversations.mjs https://agent-talk.nyphon.de
