name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_PRODUCTION after the test Worker has passed its live smoke test.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:adapter
      - run: npx cf build --mode production
      - name: Refuse an existing DNS record
        run: |
          records="$(npx cf dns records list --zone nyphon.de --name agent-talk.nyphon.de --per-page 1)"
          if [ "$records" != "[]" ]; then
            echo "agent-talk.nyphon.de already has a DNS record; refusing to change it."
            exit 1
          fi
      - run: npx cf deploy --prebuilt --mode production
