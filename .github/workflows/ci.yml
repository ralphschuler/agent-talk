name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The upgrade smoke executes the released 1:1 adapter from its pinned commit.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:adapter
      - run: npx tsc --ignoreConfig --noEmit --target es2024 --lib es2024,dom --module preserve --moduleResolution bundler --skipLibCheck --allowImportingTsExtensions portal/browser.ts
      - run: node scripts/smoke-offline.mjs
      - run: node scripts/test-local-e2e.mjs
      - run: npm run build
      - run: npx cf build --mode test
      - run: npx vp build --config portal/vite.config.ts
      - run: node scripts/test-owner-release.mjs
      - run: node scripts/test-owner-live-gate.mjs
      - run: node scripts/test-owner-live-storage.mjs
      - run: node scripts/test-owner-live-human-signin.mjs
      - name: Verify owner portal and real local MCP clients
        run: |
          npm run dev > "$RUNNER_TEMP/agent-talk-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:5173/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:5173/healthz >/dev/null
          AGENT_TALK_TEST_RELAY=http://localhost:5173 AGENT_TALK_CHROME="$(command -v google-chrome)" node --import tsx scripts/test-portal-session.mjs
