name: Deploy canonical test
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: agent-talk-canonical-test
  cancel-in-progress: false
jobs:
  authorization-gate:
    if: github.repository == 'ralphschuler/agent-talk' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'ralphschuler' && github.triggering_actor == 'ralphschuler'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Require owner authorization, active repository rules, merged main SHA, and exact Verify
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/canonical-rules.json"
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/canonical-pulls.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 --json workflowName,headSha,status,conclusion > "$RUNNER_TEMP/canonical-runs.json"
          node scripts/canonical-test-authorization.mjs "$RUNNER_TEMP/canonical-rules.json" "$RUNNER_TEMP/canonical-pulls.json" "$RUNNER_TEMP/canonical-runs.json"
          printf 'authorized=true\n' >> "$GITHUB_OUTPUT"
  deploy:
    needs: authorization-gate
    if: github.ref == 'refs/heads/main' && needs.authorization-gate.outputs.authorized == 'true'
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
      EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Prepare isolated resources
        run: node scripts/canonical-test-infra.mjs prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build canonical test Worker
        run: npx cf build --mode canonical-test
        env:
          OWNER_OAUTH_CLIENT_ID: ${{ secrets.OWNER_OAUTH_CLIENT_ID }}
      - name: Deploy isolated Worker and fresh SQLite classes
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(JSON.stringify({GITHUB_CLIENT_SECRET:process.env.OWNER_OAUTH_CLIENT_SECRET}))' | npx cf deploy --prebuilt --mode canonical-test --quiet --secrets-file /dev/stdin --message "$EXPECTED_RELEASE"
        env:
          OWNER_OAUTH_CLIENT_ID: ${{ secrets.OWNER_OAUTH_CLIENT_ID }}
          OWNER_OAUTH_CLIENT_SECRET: ${{ secrets.OWNER_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Attach only the collision-free canonical test hostname
        run: node scripts/canonical-test-infra.mjs attach
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify test ownership and hostname
        run: node scripts/canonical-test-infra.mjs verify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public HTTPS and closed MCP access
        run: node scripts/smoke-canonical-test.mjs
