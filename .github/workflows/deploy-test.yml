name: Deploy test
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-talk-deploy-test
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 12
    runs-on: ubuntu-latest
    environment: test
    env:
      CF_SEND_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
      EXPECTED_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 24, cache: npm}
      - name: Verify required check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion=="success")' | grep -qx true
      - run: npm ci
      - run: npx cf build --mode test
      - run: node scripts/cloudflare-rollout.mjs preflight test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload version to the existing Worker
        run: npx cf workers versions create --prebuilt --mode test --message "$EXPECTED_RELEASE"
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/agent-talk-version.jsonl
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Activate the uploaded version
        run: node scripts/cloudflare-rollout.mjs promote test
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/agent-talk-version.jsonl
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify existing release target
        run: node scripts/cloudflare-rollout.mjs verify-owner test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check distinct SQLite storage
        run: node scripts/cloudflare-rollout.mjs storage test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Encrypted round trip and restart through MCP
        run: npm run smoke:mcp -- https://agent-talk-test.ralph-cfd.workers.dev
