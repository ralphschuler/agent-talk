name: Deploy test
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-talk-deploy-test
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 12
    runs-on: ubuntu-latest
    environment: test
    env:
      CF_SEND_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}
      - name: Verify required check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion=="success")' | grep -qx true
      - run: npm ci
      - run: npx cf build --mode test
      - run: node scripts/cloudflare-rollout.mjs preflight test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx cf deploy --prebuilt --mode test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check distinct SQLite storage
        run: node scripts/cloudflare-rollout.mjs storage test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Encrypted round trip and restart through MCP
        run: npm run smoke:mcp -- https://agent-talk-test.ralph-cfd.workers.dev
