name: Owner Worker name preflight
on:
  push:
    branches: [chore/owner-portal-preflight-20261126]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 3
    steps:
      - name: Check existing account and Worker names
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error("Required Cloudflare environment secrets are missing.");
          const base = "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account) + "/workers";
          async function get(path) {
            const response = await fetch(base + path, { headers: { Authorization: "Bearer " + token } });
            if (!response.ok) throw new Error("Cloudflare read failed with HTTP " + response.status);
            const data = await response.json();
            if (!data.success) throw new Error("Cloudflare returned an unsuccessful response.");
            return data;
          }
          const subdomain = await get("/subdomain");
          console.log("Expected workers.dev suffix confirmed:", subdomain.result?.subdomain === "ralph-cfd");
          const names = new Set();
          let page = 1;
          let pages;
          do {
            const result = await get("/scripts?per_page=100&page=" + page);
            for (const worker of result.result) names.add(worker.id);
            pages = result.result_info?.total_pages ?? 1;
            page++;
          } while (page <= pages);
          for (const name of ["agent-talk-owner-test", "agent-talk-owner"]) {
            console.log(name + ":", names.has(name) ? "already exists" : "available in account");
          }
          NODE
